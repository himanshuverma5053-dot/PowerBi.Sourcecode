<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Square container with subtly curved corners (no border line) -->
  <rect width="100" height="100" rx="18" fill="#EADBF8" stroke="none" />
  
  <!-- 3 Horizontal Rounded Bars -->
  <g stroke="#1F132B" stroke-width="7.5" stroke-linecap="round">
    <line x1="30" y1="37" x2="70" y2="37" />
    <line x1="30" y1="50" x2="70" y2="50" />
    <line x1="30" y1="63" x2="70" y2="63" />
  </g>
</svg>
