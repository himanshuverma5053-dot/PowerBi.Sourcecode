  <!-- RIGHT HAND EXTENDING FINGERS ACROSS -->
  <path
    d="M 230 120 L 305 175 C 315 182 312 195 300 200 L 265 210 C 258 212 250 208 245 202 L 195 155"
    fill="url(#handshakeSparshGrad1)"
