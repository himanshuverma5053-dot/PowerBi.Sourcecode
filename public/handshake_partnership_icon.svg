<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 280" fill="none">
  <defs>
    <linearGradient id="handshakeSparshGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F6DFE" />
      <stop offset="25%" stop-color="#6F60FA" />
      <stop offset="50%" stop-color="#9C4EF2" />
      <stop offset="75%" stop-color="#CA44CF" />
      <stop offset="100%" stop-color="#F94CAB" />
    </linearGradient>
    <linearGradient id="handshakeSparshGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F94CAB" />
      <stop offset="25%" stop-color="#CA44CF" />
      <stop offset="50%" stop-color="#9C4EF2" />
      <stop offset="75%" stop-color="#6F60FA" />
      <stop offset="100%" stop-color="#4F6DFE" />
    </linearGradient>
  </defs>

  <!-- LEFT SLEEVE / CUFF -->
  <polygon
    points="145,55 190,75 160,150 115,130"
