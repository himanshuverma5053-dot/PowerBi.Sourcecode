<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Square container with subtly curved corners (no border line) -->
  <rect width="100" height="100" rx="18" fill="#B149E8" stroke="none" />
  
  <!-- Diagonal Crossing Bars -->
  <g stroke="#3E2E4E" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <line x1="31" y1="31" x2="69" y2="69" />
    <line x1="69" y1="31" x2="31" y2="69" />
  </g>
</svg>
