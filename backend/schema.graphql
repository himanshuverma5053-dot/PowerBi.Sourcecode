type Query {
  listProducts(category: String, brand: String, rimSize: Int, search: String): [TyreProduct] @aws_api_key @aws_cognito_user_pools
  getProduct(id: ID!): TyreProduct @aws_api_key @aws_cognito_user_pools
  listOrders: [Order] @aws_cognito_user_pools(cognito_groups: ["Admin"])
  trackOrder(query: String!): [Order] @aws_api_key @aws_cognito_user_pools
  getAdvisorAdvice(vehicleModel: String, monthlyKm: Int, roadCondition: String, budget: String, drivingStyle: String): AIAdvisorResponse @aws_api_key @aws_cognito_user_pools
}

type Mutation {
  createProduct(input: CreateTyreProductInput!): TyreProduct @aws_cognito_user_pools(cognito_groups: ["Admin"])
  updateProduct(id: ID!, input: CreateTyreProductInput!): TyreProduct @aws_cognito_user_pools(cognito_groups: ["Admin"])
  deleteProduct(id: ID!): Boolean @aws_cognito_user_pools(cognito_groups: ["Admin"])
  createOrder(input: CreateOrderInput!): Order @aws_api_key @aws_cognito_user_pools
